<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 920" role="img" aria-labelledby="heroArtTitle heroArtDesc">
  <title id="heroArtTitle">Layered architectural arches in navy and gold</title>
  <desc id="heroArtDesc">An abstract architectural scene with receding arches, a warm golden light and fine geometric lines.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1b2c"/>
      <stop offset=".55" stop-color="#0f2940"/>
      <stop offset="1" stop-color="#071625"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f1ca8b" stop-opacity=".95"/>
      <stop offset=".45" stop-color="#d5a25b" stop-opacity=".45"/>
      <stop offset="1" stop-color="#c38f47" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="archFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c5675"/>
      <stop offset="1" stop-color="#12304a"/>
    </linearGradient>
    <linearGradient id="archMid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b6a89"/>
      <stop offset="1" stop-color="#163751"/>
    </linearGradient>
    <linearGradient id="archFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a526d"/>
      <stop offset="1" stop-color="#0b2033"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8ab66" stop-opacity=".26"/>
      <stop offset=".45" stop-color="#7d6238" stop-opacity=".09"/>
      <stop offset="1" stop-color="#071625" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3d49a" stop-opacity=".35"/>
      <stop offset="1" stop-color="#f3d49a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="column" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#071625"/>
      <stop offset=".55" stop-color="#1a3d57"/>
      <stop offset="1" stop-color="#0a1e30"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#f5f1ea" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".86" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope=".3"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="760" height="920" fill="url(#bg)"/>
  <circle cx="556" cy="262" r="240" fill="url(#sunGlow)"/>
  <circle cx="556" cy="262" r="168" fill="none" stroke="#f3d49a" stroke-opacity=".14"/>

  <!-- Distant hall -->
  <path d="M230 832V424a230 230 0 0 1 460 0v408Z" fill="url(#archFar)"/>
  <g stroke="#f5f1ea" stroke-opacity=".08">
    <path d="M294 832V392"/>
    <path d="M358 832V334"/>
    <path d="M422 832V306"/>
    <path d="M486 832V306"/>
    <path d="M550 832V334"/>
    <path d="M614 832V392"/>
  </g>
  <path d="M230 832V424a230 230 0 0 1 460 0v408" fill="none" stroke="#f3d49a" stroke-opacity=".28"/>

  <!-- Left arch -->
  <path d="M40 832V532a150 150 0 0 1 300 0v300Z" fill="url(#archMid)" opacity=".94"/>
  <path d="M40 832V532a150 150 0 0 1 300 0v300" fill="none" stroke="#f5f1ea" stroke-opacity=".12"/>
  <path d="M76 832V550a114 114 0 0 1 228 0v282" fill="none" stroke="#071625" stroke-opacity=".28"/>

  <!-- Right partial arch -->
  <path d="M622 838V446a154 154 0 0 1 308 0v392Z" fill="#0d2337"/>
  <path d="M622 838V446a154 154 0 0 1 308 0v392" fill="none" stroke="#f3d49a" stroke-opacity=".16"/>

  <!-- Foreground arch -->
  <path d="M424 850V718a138 138 0 0 1 276 0v132Z" fill="url(#archFront)"/>
  <path d="M424 850V718a138 138 0 0 1 276 0v132" fill="none" stroke="#f3d49a" stroke-opacity=".46"/>
  <path d="M468 850V726a94 94 0 0 1 188 0v124" fill="none" stroke="#071625" stroke-opacity=".5"/>

  <!-- Sunlit beam -->
  <path d="M556 262 300 850h330Z" fill="url(#beam)" opacity=".5"/>
  <path d="M556 262 430 850h52Z" fill="#f3d49a" opacity=".06"/>

  <!-- Floor -->
  <rect y="832" width="760" height="88" fill="url(#floor)"/>
  <path d="M0 832h760" stroke="#f3d49a" stroke-opacity=".22"/>

  <!-- Framing columns -->
  <rect x="0" y="120" width="26" height="712" fill="url(#column)"/>
  <rect x="734" y="120" width="26" height="712" fill="url(#column)"/>
  <path d="M26 120v712M734 120v712" stroke="#f3d49a" stroke-opacity=".22"/>

  <!-- Fine details -->
  <g fill="#f3d49a">
    <circle cx="120" cy="248" r="2.2" opacity=".65"/>
    <circle cx="178" cy="204" r="1.4" opacity=".4"/>
    <circle cx="664" cy="368" r="1.8" opacity=".5"/>
    <circle cx="88" cy="422" r="1.3" opacity=".35"/>
    <circle cx="698" cy="188" r="1.4" opacity=".4"/>
  </g>
  <path d="M92 832V584" stroke="#f5f1ea" stroke-opacity=".1"/>
  <path d="M120 832V606" stroke="#f5f1ea" stroke-opacity=".06"/>

  <rect width="760" height="920" fill="url(#grid)"/>
  <rect width="760" height="920" filter="url(#grain)" opacity=".22" style="mix-blend-mode:overlay"/>

  <g fill="#f5f1ea">
    <text x="48" y="866" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="4.5" opacity=".5">OM GROUP</text>
    <text x="48" y="886" font-family="Arial, Helvetica, sans-serif" font-size="7.5" letter-spacing="2.6" opacity=".32">LONDON · DUBAI · SINGAPORE</text>
  </g>
</svg>
